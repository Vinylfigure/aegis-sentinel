name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Two @claude events on one issue never run simultaneously. This is a collision
# control, not a dedup control — a duplicate event still queues and runs after
# the first finishes. Dedup is handled one layer up by the
# `overlord-work-order:` body-line check at dispatch time.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # The primary cost bound. A stuck agent otherwise runs to GitHub's 6-hour
    # default, burning the shared subscription quota that also feeds live
    # sessions.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Floating major includes the >= v1.0.94 bot-trigger security fix
      # (CVE-2025-66032). Note: this repo's dispatch issues are NOT bot-authored
      # — verified 2026-07-30, the overlord writes as `Vinylfigure` (type User)
      # via the claude-github-mcp-connector app, while only the child's own
      # comments are `claude[bot]`. The pin stands as ordinary dependency
      # hygiene, not because dispatch arrives from a bot.
      # Echo-retrigger needs no actor guard: `allowed_bots` defaults to "",
      # so no bot can trigger this workflow at all.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --max-turns is the runaway bound, not the effort budget; per-order
          # effort budgets live in the work-order spec.
          #
          # --allowedTools is the POST-BOOTSTRAP TIER: Python (pip, ruff,
          # pytest) plus verify.sh and git. Narrowed from the bootstrap-tier
          # bare `Bash` (equivalent to Bash(*)) once the stack was chosen —
          # see the bootstrap PR that replaced the janus:bootstrap sentinel
          # blocks in scripts/verify.sh. A future stack change re-widens this
          # only for the duration of that one bootstrap run.
          claude_args: --max-turns 50 --allowedTools "Bash(scripts/verify.sh:*),Bash(scripts/test-hooks.sh:*),Bash(git:*),Bash(pytest:*),Bash(ruff:*),Bash(pip:*),Bash(pip3:*)"
